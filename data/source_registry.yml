# Source registry fixture — one entry per source class in the README's
# "Source policy" table. Loaded by src/ingestion/load_source_registry.py.
sources:
  - source_id: companies_house
    source_name: UK Companies House
    source_type: government_registry
    authority_tier: 1
    permitted_claim_types:
      - legal_name
      - company_status
      - incorporation_date
      - registered_office
      - officer_relationship
    freshness_sla_hours: 168
    pii_classification: public
    allowed_for_agent_retrieval: true
    requires_human_review: false
    can_create_accepted_claims: true
    policy_note: "Legal identity, status, officers, filings. Accepted within source scope."

