services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: signalgraph
      POSTGRES_PASSWORD: signalgraph
      POSTGRES_DB: signalgraph
    ports:
      - "5432:5432"
    volumes:
      - signalgraph_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U signalgraph -d signalgraph"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  signalgraph_postgres_data:
