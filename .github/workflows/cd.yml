name: CD

on:
  push:
    branches: [main]

concurrency:
  group: cd-main
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    env:
      DATABASE_URL: postgresql+psycopg://signalgraph:signalgraph@localhost:5432/signalgraph

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: signalgraph
          POSTGRES_PASSWORD: signalgraph
          POSTGRES_DB: signalgraph
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U signalgraph -d signalgraph"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      # Self-contained gate: build/push only happens if the app actually
      # works against a real database, independent of CI's own run.
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Apply migrations
        run: uv run alembic upgrade head

      - name: Run test suite (gate before publishing an image)
        run: uv run pytest

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/bellyk4real/signalgraph
          tags: |
            type=sha,prefix=,format=long
            type=raw,value=latest

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
