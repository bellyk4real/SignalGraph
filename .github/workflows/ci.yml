name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgresql+psycopg://signalgraph:signalgraph@localhost:5432/signalgraph
  PGHOST: localhost
  PGPORT: 5432
  PGUSER: signalgraph
  PGPASSWORD: signalgraph
  PGDATABASE: signalgraph

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: signalgraph
          POSTGRES_PASSWORD: signalgraph
          POSTGRES_DB: signalgraph
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U signalgraph -d signalgraph"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Lint
        run: uv run ruff check .

      - name: Apply migrations
        run: uv run alembic upgrade head

      - name: Run test suite
        run: uv run pytest

      - name: dbt build
        working-directory: dbt
        env:
          DBT_PROFILES_DIR: .
        run: uv run dbt build

      - name: Run demo walkthrough (smoke test)
        run: uv run python -m demo.run_investor_matching
